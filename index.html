<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fashion Over Faith 💙</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef7ff;
    color:#102a43;
}

/* HEADER */
header{
    background:linear-gradient(135deg,#052f68,#168cff);
    color:white;
    padding:20px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:500;
}

.logo{
    font-size:28px;
    font-weight:800;
}

.logo span{
    color:#dff4ff;
}

nav{
    display:flex;
    gap:8px;
}

nav button{
    border:0;
    background:white;
    color:#0755a5;
    padding:10px 15px;
    border-radius:25px;
    cursor:pointer;
    font-weight:bold;
}

/* HERO */
.hero{
    text-align:center;
    padding:75px 20px;
    background:linear-gradient(135deg,#dff3ff,#fff);
}

.hero h1{
    font-size:52px;
    color:#0755a5;
    margin-bottom:12px;
}

.hero p{
    font-size:18px;
    margin-bottom:25px;
}

.shop-btn{
    border:0;
    background:#0878d1;
    color:white;
    padding:14px 30px;
    border-radius:30px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

/* SEARCH */
.search-area{
    text-align:center;
    padding:30px 7% 15px;
}

#search{
    width:90%;
    max-width:650px;
    padding:17px 23px;
    border:2px solid #168cff;
    border-radius:35px;
    outline:none;
    font-size:16px;
}

/* CATEGORY BUTTONS */
.categories{
    text-align:center;
    padding:15px 5% 30px;
}

.categories button{
    border:0;
    background:#d9edff;
    color:#0755a5;
    padding:10px 17px;
    margin:5px;
    border-radius:25px;
    cursor:pointer;
    font-weight:bold;
}

.categories button:hover{
    background:#0878d1;
    color:white;
}

/* SECTIONS */
.section{
    padding:25px 7% 55px;
}

.section h2{
    color:#0755a5;
    text-align:center;
    font-size:30px;
    margin-bottom:28px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(205px,1fr));
    gap:22px;
}

/* PRODUCT */
.product{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,75,150,.12);
    transition:.25s;
    position:relative;
}

.product:hover{
    transform:translateY(-6px);
}

.product img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.product-info{
    padding:16px;
}

.product-info h3{
    margin-bottom:7px;
}

.category{
    color:#168cff;
    font-size:12px;
    font-weight:bold;
    margin-bottom:8px;
}

.price{
    font-size:18px;
    font-weight:bold;
    margin:10px 0;
}

.badge{
    position:absolute;
    top:12px;
    left:12px;
    background:#0878d1;
    color:white;
    padding:6px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.actions{
    display:flex;
    gap:7px;
}

.cart-btn{
    flex:1;
    border:0;
    background:#0878d1;
    color:white;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.wishlist-btn{
    width:43px;
    border:2px solid #0878d1;
    background:white;
    color:#0878d1;
    border-radius:10px;
    cursor:pointer;
    font-size:20px;
}

.wishlist-btn.active{
    background:#0878d1;
    color:white;
}

/* PANELS */
.panel{
    position:fixed;
    right:-430px;
    top:0;
    width:390px;
    max-width:92%;
    height:100%;
    background:white;
    z-index:1000;
    padding:25px;
    box-shadow:-5px 0 25px rgba(0,0,0,.2);
    transition:.3s;
    overflow-y:auto;
}

.panel.open{
    right:0;
}

.panel h2{
    color:#0755a5;
    margin-bottom:20px;
}

.close{
    float:right;
    border:0;
    background:#e4f3ff;
    color:#0755a5;
    border-radius:50%;
    width:34px;
    height:34px;
    cursor:pointer;
}

/* CART */
.cart-item{
    display:flex;
    gap:10px;
    align-items:center;
    padding:14px 0;
    border-bottom:1px solid #ddd;
}

.cart-item img{
    width:65px;
    height:70px;
    object-fit:cover;
    border-radius:8px;
}

.cart-info{
    flex:1;
}

.quantity{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:7px;
}

.quantity button{
    border:0;
    background:#dcefff;
    color:#0755a5;
    width:25px;
    height:25px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.remove{
    border:0;
    background:#ffecef;
    color:#d90032;
    padding:7px;
    border-radius:7px;
    cursor:pointer;
}

.total{
    font-size:21px;
    font-weight:bold;
    color:#0755a5;
    margin-top:20px;
}

.checkout{
    width:100%;
    border:0;
    background:#0755a5;
    color:white;
    padding:14px;
    margin-top:15px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

/* FOOTER */
footer{
    background:#052f68;
    color:white;
    text-align:center;
    padding:35px;
}

footer h2{
    margin-bottom:10px;
}

footer p{
    margin:6px;
}

/* MOBILE */
@media(max-width:600px){

    header{
        justify-content:center;
    }

    .hero h1{
        font-size:36px;
    }

    .product img{
        height:230px;
    }

    .panel{
        width:350px;
    }
}
</style>
</head>

/* =========================
   CART + WISHLIST
========================= */

let cart=[];
let wishlist=[];


/* DISPLAY PRODUCTS */

function displayProducts(list=products,target="productGrid"){

    const grid=document.getElementById(target);

    if(!grid)return;

    grid.innerHTML="";

    list.forEach((product,index)=>{

        const originalIndex=products.indexOf(product);

        const wished=wishlist.some(
            item=>item.name===product.name
        );

        let badge="";

        if(product.new){
            badge=`<div class="badge">NEW</div>`;
        }

        if(product.best){
            badge=`<div class="badge">BEST SELLER</div>`;
        }

        grid.innerHTML+=`

        <div class="product">

        ${badge}

        <img
        src="${product.image}?auto=format&fit=crop&w=600&q=80"
        alt="${product.name}">

        <div class="product-info">

        <div class="category">
        ${product.category.toUpperCase()}
        </div>

        <h3>${product.name}</h3>

        <div class="price">
        ₦${product.price.toLocaleString()}
        </div>

        <div class="actions">

        <button
        class="cart-btn"
        onclick="addToCart(${originalIndex})">
        Add to Cart
        </button>

        <button
        class="wishlist-btn ${wished?"active":""}"
        onclick="toggleWishlist(${originalIndex})">
        ${wished?"♥":"♡"}
        </button>

        </div>

        </div>
        </div>

        `;
    });
}


/* CART */

function addToCart(index){

    const product=products[index];

    const existing=cart.find(
        item=>item.name===product.name
    );

    if(existing){
        existing.quantity++;
    }else{
        cart.push({
            ...product,
            quantity:1
        });
    }

    updateCart();

    alert(product.name+" added to your cart! 🛍️");
}


function updateCart(){

    const container=document.getElementById("cartItems");

    container.innerHTML="";

    let total=0;
    let count=0;

    cart.forEach((item,index)=>{

        total+=item.price*item.quantity;

        count+=item.quantity;

        container.innerHTML+=`

        <div class="cart-item">

        <img src="${item.image}?auto=format&fit=crop&w=150&q=70">

        <div class="cart-info">

        <strong>${item.name}</strong>

        <br>

        ₦${item.price.toLocaleString()}

        <div class="quantity">

        <button onclick="changeQuantity(${index},-1)">
        −
        </button>

        <span>${item.quantity}</span>

        <button onclick="changeQuantity(${index},1)">
        +
        </button>

        </div>

        </div>

        <button
        class="remove"
        onclick="removeFromCart(${index})">
        ✕
        </button>

        </div>
        `;
    });

    document.getElementById("cartTotal")
    .textContent=total.toLocaleString();

    document.getElementById("cartCount")
    .textContent=count;
}


function changeQuantity(index,change){

    cart[index].quantity+=change;

    if(cart[index].quantity<=0){
        cart.splice(index,1);
    }

    updateCart();
}


function removeFromCart(index){

    cart.splice(index,1);

    updateCart();
}


/* WISHLIST */

function toggleWishlist(index){

    const product=products[index];

    const existing=wishlist.findIndex(
        item=>item.name===product.name
    );

    if(existing>=0){
        wishlist.splice(existing,1);
    }else{
        wishlist.push(product);
    }

    updateWishlist();

    displayProducts();

    displayProducts(
        products.filter(p=>p.new),
        "newArrivals"
    );

    displayProducts(
        products.filter(p=>p.best),
        "bestSellers"
    );
}


function updateWishlist(){

    const container=
    document.getElementById("wishlistItems");

    container.innerHTML="";

    wishlist.forEach((item,index)=>{

        container.innerHTML+=`

        <div class="cart-item">

        <img src="${item.image}?auto=format&fit=crop&w=150&q=70">

        <div class="cart-info">

        <strong>${item.name}</strong>

        <br>

        ₦${item.price.toLocaleString()}

        </div>

        <button
        class="remove"
        onclick="removeWishlist(${index})">
        ✕
        </button>

        </div>

        `;
    });

    document.getElementById("wishCount")
    .textContent=wishlist.length;
}


function removeWishlist(index){

    wishlist.splice(index,1);

    updateWishlist();

    displayProducts();

    displayProducts(
        products.filter(p=>p.new),
        "newArrivals"
    );

    displayProducts(
        products.filter(p=>p.best),
        "bestSellers"
    );
}


/* SEARCH */

function searchProducts(){

    const query=
    document.getElementById("search")
    .value
    .toLowerCase();

    const results=products.filter(product=>

        product.name.toLowerCase()
        .includes(query)

        ||

        product.category.toLowerCase()
        .includes(query)

    );

    displayProducts(results);
}


/* FILTER */

function filterProducts(category){

    document.getElementById("search").value="";

    if(category==="all"){
        displayProducts(products);
    }else{

        displayProducts(
            products.filter(
                product=>product.category===category
            )
        );
    }

    document.getElementById("shop")
    .scrollIntoView({
        behavior:"smooth"
    });
}


/* PANELS */

function openCart(){

    closePanels();

    document.getElementById("cartPanel")
    .classList.add("open");
}


function openWishlist(){

    closePanels();

    document.getElementById("wishlistPanel")
    .classList.add("open");
}


function closePanels(){

    document.getElementById("cartPanel")
    .classList.remove("open");

    document.getElementById("wishlistPanel")
    .classList.remove("open");
}


/* CHECKOUT */

function checkout(){

    if(cart.length===0){

        alert("Your cart is empty! 😭");

        return;
    }

    const total=cart.reduce(
        (sum,item)=>sum+(item.price*item.quantity),
        0
    );

    alert(
        "Thank you for shopping at Fashion Over Faith! 💙\n\n"+
        "Your total is ₦"+
        total.toLocaleString()+
        "\n\nCheckout system coming soon!"
    );
}


/* START */

displayProducts();

displayProducts(
    products.filter(p=>p.new),
    "newArrivals"
);

displayProducts(
    products.filter(p=>p.best),
    "bestSellers"
);

updateCart();
updateWishlist();

</script>
